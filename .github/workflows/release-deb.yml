name: Release Debian Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ros_distro:
        description: "ROS 2 distro used to build the deb"
        required: false
        default: jazzy
        type: string
      deb_version:
        description: "Override deb version (default: tag name without leading v)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  DEFAULT_ROS_DISTRO: jazzy
  DEB_PACKAGE_NAME: ocs2-ros2-bundle
  INSTALL_PREFIX: /opt/ocs2_ros2
  REQUIRED_OCS2_PACKAGES: >-
    ocs2_core
    ocs2_ddp
    ocs2_mobile_manipulator
    ocs2_mobile_manipulator_ros
    ocs2_mpc
    ocs2_msgs
    ocs2_oc
    ocs2_pinocchio_interface
    ocs2_qp_solver
    ocs2_robotic_assets
    ocs2_robotic_tools
    ocs2_ros_interfaces
    ocs2_self_collision
    ocs2_self_collision_visualization
    ocs2_thirdparty

jobs:
  build_deb:
    runs-on: ubuntu-24.04
    outputs:
      ros_distro: ${{ steps.meta.outputs.ros_distro }}
      deb_file: ${{ steps.meta.outputs.deb_file }}
      deb_version: ${{ steps.meta.outputs.deb_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          set -eo pipefail
          chmod +x scripts/*.sh
          INPUT_ROS_DISTRO="${{ github.event.inputs.ros_distro }}" \
          INPUT_DEB_VERSION="${{ github.event.inputs.deb_version }}" \
          RELEASE_TAG_OVERRIDE="${{ github.ref_name }}" \
          scripts/resolve_release_meta.sh | tee /tmp/release_meta.txt

          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < /tmp/release_meta.txt

      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ steps.meta.outputs.ros_distro }}

      - name: Install system tools
        shell: bash
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            python3-rosdep \
            python3-ament-package \
            python3-colcon-core \
            python3-colcon-common-extensions \
            fakeroot \
            dpkg-dev \
            rsync \
            build-essential \
            cmake

          sudo rosdep init || true
          rosdep update

      - name: Install package dependencies via rosdep
        shell: bash
        run: |
          set -eo pipefail
          source "/opt/ros/${{ steps.meta.outputs.ros_distro }}/setup.bash"
          rosdep install --from-paths . --ignore-src -r -y

      - name: Build and package deb
        shell: bash
        run: |
          set -eo pipefail
          chmod +x scripts/*.sh
          scripts/build_release_deb.sh \
            --ros-distro "${{ steps.meta.outputs.ros_distro }}" \
            --deb-version "${{ steps.meta.outputs.deb_version }}" \
            --release-tag "${{ steps.meta.outputs.release_tag }}" \
            --deb-package-name "${DEB_PACKAGE_NAME}" \
            --install-prefix "${INSTALL_PREFIX}" \
            --required-packages "${REQUIRED_OCS2_PACKAGES}" \
            --skip-deps

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-bundle-${{ steps.meta.outputs.deb_version }}
          path: ${{ steps.meta.outputs.deb_file }}
          if-no-files-found: error

      - name: Upload deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.deb_file }}

  consume_deb:
    runs-on: ubuntu-24.04
    needs: build_deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ needs.build_deb.outputs.ros_distro }}

      - name: Install base tools
        shell: bash
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Download deb from release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eo pipefail
          gh release download "${{ needs.build_deb.outputs.release_tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${{ needs.build_deb.outputs.deb_file }}"

      - name: Download deb from workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/download-artifact@v4
        with:
          name: debian-bundle-${{ needs.build_deb.outputs.deb_version }}

      - name: Install deb and verify downstream configure
        shell: bash
        run: |
          set -eo pipefail
          chmod +x scripts/*.sh
          scripts/consume_release_deb.sh \
            --deb-file "${{ needs.build_deb.outputs.deb_file }}" \
            --ros-distro "${{ needs.build_deb.outputs.ros_distro }}" \
            --install-prefix "${INSTALL_PREFIX}"